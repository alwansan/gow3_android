# Experimental AYN Thor boot profile; independent of the desktop installation.
upscaler=off
output_res=1280x720
# Mobile-optimized launch-parameter defaults. Keep these in sync with
# android-launcher .../data/LaunchParams.kt (the Home page shows the same values
# when a key is missing).
render_resolution=720p
anisotropy=0
vibration=100
fps_limit=60
frames_queued=2
engine_fps=60
display_mode=fullscreen
live_resolution=0
sharpen=0
sharpness=0.50
# 0=保持宽高比居中适配(默认), 1=画面拉伸铺满屏幕(不保持宽高比)。
# 应用侧显示桥消费；与 android-launcher LaunchParams.kt 的默认值保持一致。
display_stretch=0
object_motion=0
# show_fps（引擎自带 FPS 叠加层）已退役：帧率显示由 launcher 侧性能 HUD 提供；
# 键缺省时运行时默认即为关，历史安装残留的 show_fps=1 由 Gow3Data.prepare 归零。
effect_chromatic_aberration=0
effect_dof=0
effect_motion_blur=0
effect_ssao=0
effect_game_aa=1
effect_dynamic_shadows=1
effect_ssr=0
skip_intro=1
debug_camera=0
debug_menu=0
mouse_look=0
# 0=手柄浮层空白触摸不移动鼠标(默认), 1=空白触摸映射为鼠标移动+左键
overlay_mouse=0

# SDL names describe positions; the Thor's printed labels are Nintendo style.
pad.cross=a
pad.circle=b
pad.square=x
pad.triangle=y
pad.l1=leftshoulder
pad.r1=rightshoulder
pad.l2=lefttrigger
pad.r2=righttrigger
pad.l3=leftstick
pad.r3=rightstick
pad.options=start
pad.touchpad=back
pad.up=dpup
pad.down=dpdown
pad.left=dpleft
pad.right=dpright
