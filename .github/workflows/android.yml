name: android

on:
  pull_request:
  push:
    branches: [main, gow3, android]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_PLATFORM: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  source-check:
    name: Android source checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Android manifests and packaging tests
        run: |
          python -m unittest \
            discover -s tests -p 'test_android_*.py'
          python -m py_compile tools/android/*.py

  release:
    name: Build Android release (signed or development APK)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # 签名双路径：配置了 4 个 secrets 时还原正式 keystore 签名；未配置时
      # build_release_apk.sh 自动生成本地 dev key 签名（产物定位为 development APK）。
      GOW3_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GOW3_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GOW3_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check SaveData regression contracts
        run: python -m unittest discover -s tests -p 'test_android_savedata_contract.py'

      - name: Restore Android SDK package cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/platforms/android-${{ env.ANDROID_PLATFORM }}
            /usr/local/lib/android/sdk/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
            /usr/local/lib/android/sdk/ndk/29.0.14206865
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}

      - name: Set up native dependency environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;29.0.14206865

      - name: Install Android and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang lld llvm cmake ninja-build meson pkg-config patchelf ccache \
            libxml2-utils unzip xz-utils zstd

      - name: Restore reproducible build caches
        uses: actions/cache@v4
        with:
          path: |
            .local-deps/android/src
            .local-deps/android/m2
            .local-deps/android/steam-libs
            ~/.cache/ccache
          key: android-${{ runner.os }}-${{ hashFiles('tools/android/**', 'cpu/**', 'gpu/CMakeLists.txt', 'gpu/third_party/**', 'ci/**') }}
          restore-keys: android-${{ runner.os }}-

      - name: Build pinned host dependencies
        shell: bash -el {0}
        run: bash ci/setup-deps.sh "$CONDA_PREFIX"

      - name: Configure build environment
        shell: bash -el {0}
        run: |
          {
            echo "GOW3_KEYSTORE=$RUNNER_TEMP/gow3-release.keystore"
            echo "GOW3_ARM64_HEADERS=$CONDA_PREFIX"
            echo "GOW3_JOBS=$(nproc)"
            echo "GOW3_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          } >> "$GITHUB_ENV"

      - name: Verify host header tree
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # build_bionic.sh 期望的布局：robin-map / VMA 在 share/cmake，Boost 在 lib/cmake。
          share_dir="$CONDA_PREFIX/share/cmake"
          cmake_dir="$CONDA_PREFIX/lib/cmake"
          echo "== $cmake_dir =="
          ls -1 "$cmake_dir"
          echo "== $share_dir (tsl-robin-map / VulkanMemoryAllocator) =="
          ls -1 "$share_dir" 2>/dev/null || true
          [[ -d "$share_dir/tsl-robin-map" ]] || {
            echo "ERROR: tsl-robin-map not found in $share_dir; run ci/setup-deps.sh" >&2
            exit 1
          }
          boost_dir=$(compgen -G "$cmake_dir/Boost-*/BoostConfig.cmake" | head -1 | xargs dirname || true)
          boost_headers_dir=$(compgen -G "$cmake_dir/boost_headers-*/boost_headers-config.cmake" | head -1 | xargs dirname || true)
          if [[ -n $boost_dir ]]; then
            echo "GOW3_BOOST_DIR=$boost_dir" >> "$GITHUB_ENV"
            echo "GOW3_BOOST_HEADERS_DIR=${boost_headers_dir:-$boost_dir}" >> "$GITHUB_ENV"
            echo "Boost CMake package: $boost_dir"
          else
            echo "ERROR: no Boost-*/BoostConfig.cmake in $cmake_dir" >&2
            exit 1
          fi

      - name: Restore signing keystore from GitHub Secrets
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set +x
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_BASE64; do
            if [[ -z ${!name:-} ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
            printf '::add-mask::%s\\n' "${!name}"
          done
          bash tools/android/inputs/prepare_signing.sh "$GOW3_KEYSTORE"

      # Fallback to the same public debug key used by the owner's CP repo. It is deliberately
      # pinned to a commit and Git blob SHA so changed/replaced bytes fail closed. This key is
      # PUBLIC and only suitable for personal/test builds, not trusted public distribution.
      - name: Restore shared signing key from CP (fallback)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        shell: bash
        run: |
          set -euo pipefail
          set +x
          key="$GOW3_KEYSTORE"
          mkdir -p "$(dirname -- "$key")"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/alwansan/CP/ce5ea5796fde91207e9e9bc1d6e75b7800a4af37/signing/checkpoint145-debug.keystore" \
            --output "$key"
          expected="adc33989411007d6eb63496b3b6ce2f4c73c8222"
          actual="$(git hash-object "$key")"
          if [[ "$actual" != "$expected" ]]; then
            rm -f -- "$key"
            echo "Shared signing keystore blob SHA mismatch; refusing to sign" >&2
            exit 1
          fi
          echo "::add-mask::android"
          keytool -list -keystore "$key" -storepass android -alias androiddebugkey >/dev/null 2>&1 || {
            rm -f -- "$key"
            echo "Shared signing keystore or expected alias/password is invalid" >&2
            exit 1
          }
          {
            echo "GOW3_KEYSTORE_PASSWORD=android"
            echo "GOW3_KEY_ALIAS=androiddebugkey"
            echo "GOW3_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Record signing mode
        shell: bash
        run: |
          if [[ -n ${ANDROID_KEYSTORE_BASE64:-} ]]; then
            echo "SIGNING_MODE=GitHub Actions keystore secret" >> "$GITHUB_ENV"
          else
            echo "SIGNING_MODE=shared public debug key from alwansan/CP (NOT a secure release signature)" >> "$GITHUB_ENV"
          fi

      - name: Fetch Steam libraries
        shell: bash
        run: |
          set -euo pipefail
          bash tools/android/inputs/fetch_steam_libs.sh

      # Vulkan 驱动不进 payload：设备侧由 DriverManager / install_bionic_driver.sh 安装
      # adrenotools 风格驱动包（下载源见 launcher assets driver_sources.json）。

      - name: Build the Bionic runtime
        shell: bash -el {0}
        run: |
          bash tools/android/build_bionic_deps.sh
          bash tools/android/build_bionic.sh

      - name: Derive and apply release version from tag
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-bionic-v')
        shell: bash
        run: |
          # 版本号以触发 tag 为准（与 release_local.sh 同一套契约）：versionName = tag 去掉 v，
          # versionCode 由上游各段数值加权 + bionic 序号推导，跨 PC 版本单调递增，
          # 保证 APK 内版本与 tag、UpdateChecker 的解析结果一致。
          version="${GITHUB_REF#refs/tags/}"
          version="${version#v}"
          upstream="${version%-bionic-v*}"
          n="${version##*-bionic-v}"
          IFS='.' read -r a b c <<< "$upstream"
          a=${a:-0}; b=${b:-0}; c=${c:-0}
          code=$((a * 1000000 + b * 10000 + c * 100 + n))
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          gradle_file=android-launcher/app/build.gradle.kts
          sed -i.bak \
            -e "s/versionName *= *\"[^\"]*\"/versionName = \"$version\"/" \
            -e "s/versionCode *= *[0-9][0-9]*/versionCode = $code/" \
            "$gradle_file"
          rm -f "$gradle_file.bak"
          grep -q "versionName = \"$version\"" "$gradle_file"
          grep -q "versionCode = $code" "$gradle_file"
          echo "Applied versionName=$version versionCode=$code from $GITHUB_REF"

      - name: Build and sign the release APK
        run: |
          bash tools/android/apk/build_release_apk.sh
          # APK 文件名含空格（"God of War III-bionic-<ver>.apk"），必须用 nullglob + 数组取产物：
          #   - 把 glob 存进变量再未加引号展开会按空格分词，判断与求值都失真；
          #   - 重定向目标加引号则不展开 glob，会生成一个名叫 "*.apk.sha256" 的字面量文件，
          #     upload-artifact 打包时它在 zip 内的路径含 '*'，会被 artifact 路径校验拒绝。
          shopt -s nullglob
          apks=(out/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "expected exactly one APK in out/release, got ${#apks[@]}" >&2
            exit 1
          fi
          apk=${apks[0]}
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(cut -d' ' -f1 "$apk.sha256")" >> "$GITHUB_ENV"

      - name: Publish build summary
        run: |
          {
            echo '## Android build/package verified'
            echo
            printf '%s\n' "- Commit: ${GITHUB_SHA}"
            printf '%s\n' "- APK: $(basename "$APK")"
            printf '%s\n' "- Version: ${RELEASE_VERSION:-from build.gradle.kts}"
            printf '%s\n' "- SHA-256: ${APK_SHA256}"
            printf '%s\n' "- Signing: ${SIGNING_MODE}"
            echo '- ABI: `arm64-v8a`'
            echo '- Scope: build, package, signature, and checksum verification only'
            echo '- Not verified by CI: device installation, Vulkan, Turnip/GPU compatibility, and gameplay'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: gow3-android-arm64-${{ github.sha }}
          path: |
            out/release/*.apk
            out/release/*.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set +x
          rm -f -- "$GOW3_KEYSTORE"

  publish-release:
    name: Publish Android release
    # 只发布 Android 形态 tag（v<pc>-bionic-v<N>），避免 PC 上游 v*-linux<N> 等 tag 被误发布。
    # secrets 上下文不能用于任何 if 条件，改用 job env 把「是否配置签名密钥」算成布尔，
    # 再在 Publish 步骤用 env 上下文判断是否创建 Release。
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-bionic-v')
    needs: release
    runs-on: ubuntu-24.04
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    permissions:
      contents: write
    steps:
      - name: Download signed APK and checksum
        uses: actions/download-artifact@v4
        with:
          name: gow3-android-arm64-${{ github.sha }}

      - name: Publish the release
        if: env.HAS_RELEASE_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
            *.apk.sha256
          generate_release_notes: true
